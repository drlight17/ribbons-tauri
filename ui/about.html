<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About</title>
  <style>
    :root,
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0e16;
      --fg: #e8ecf7;
      --muted: #8e99b3;
      --link: #8fb7ff;
      --panel: #151b28;
      --panel-hover: #1e2638;
      --line: #2c3448;
      --icon-shadow: rgb(0 0 0 / 45%);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f0f2f7;
      --fg: #1a2233;
      --muted: #6b7790;
      --link: #3b5bdb;
      --panel: #ffffff;
      --panel-hover: #f5f7fb;
      --line: #d8dee9;
      --icon-shadow: rgb(30 40 60 / 20%);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      padding: 24px 28px;
      user-select: none;
      transition: background-color .2s ease, color .2s ease;
    }
    .header { display: flex; align-items: center; gap: 18px; }
    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      object-fit: contain;
      flex: 0 0 auto;
      filter: drop-shadow(0 8px 20px var(--icon-shadow));
    }
    h1 { font-size: 23px; margin: 0 0 4px; }
    .version { color: var(--link); font-size: 15px; }
    .description { color: var(--muted); line-height: 1.5; margin: 20px 0; }
    .meta { display: grid; grid-template-columns: 88px 1fr; gap: 9px 14px; font-size: 14px; }
    .meta .label { color: var(--muted); }
    .meta .value { color: var(--fg); overflow-wrap: anywhere; }
    .link { color: var(--link); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-align: left; }
    .link:hover { text-decoration: underline; }
    .actions { margin-top: auto; display: flex; justify-content: flex-end; gap: 10px; }
    button.action {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--fg);
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    button.action:hover { background: var(--panel-hover); }
    button.action.primary { background: #2867e8; border-color: #2867e8; color: #fff; }
    button.action.primary:hover { background: #3b77f0; }
  </style>
</head>
<body>
  <div class="header">
    <img class="app-icon" src="icon.png" alt="Ribbons Screensaver" />
    <div>
      <h1 id="appName">Ribbons Screensaver</h1>
      <div class="version" id="version"></div>
    </div>
  </div>
  <p class="description" id="description" data-i18n="about_description">
    Windows-like Ribbons Screensaver with modern and classic ribbon engines,
    multi-monitor support and system-aware media detection.
  </p>
  <div class="meta">
    <div class="label" data-i18n="about_author">Author</div>
    <div class="value" id="author"></div>
    <div class="label" data-i18n="about_website">Website</div>
    <div class="value"><button class="link" id="website"></button></div>
    <div class="label" data-i18n="about_source">Source</div>
    <div class="value"><button class="link" id="source"></button></div>
    <div class="label" data-i18n="about_license">License</div>
    <div class="value" id="license"></div>
  </div>
  <div class="actions">
    <button class="action primary" id="close" data-i18n="about_close">Close</button>
  </div>
  <script type="module" src="about.js"></script>
</body>
</html>
